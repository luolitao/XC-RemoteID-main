; XC-RemoteID - GB 46750-2025 compliant Remote ID firmware
; PlatformIO build configuration

[env]
framework = espidf
monitor_speed = 115200
upload_speed  = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags =
    -std=gnu++11
board_build.partitions = partitions.csv


; -----------------------------------------------------------------------------
; ESP32 WROOM-32
; -----------------------------------------------------------------------------

[env:esp32s0wd_mock]
; 示例：降级到 ESP-IDF 5.1.2 (非常稳定，适合量产)
platform = espressif32 @ 6.12.0 

; 示例：降级到 ESP-IDF 4.4.6 (LTS 长期支持版，但需修改部分 5.x 代码)
; platform = espressif32 @ 5.4.0

; 示例：使用最新的开发版 (您目前的 6.12.0 大约对应 ESP-IDF 5.3/5.4+)
; platform = espressif32 @ ^6.8.0
board = esp32dev
framework = espidf

; --- 硬件参数覆盖 ---
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L

; --- 串口配置 ---
upload_speed = 115200
monitor_speed = 460800
monitor_filters = esp32_exception_decoder

; ==========================================
; 【关键】指定 OTA 分区表
; ==========================================
board_build.partitions = partitions_ota.csv

; ==========================================
; 核心修复：强制启用单核支持 (针对 ESP32-S0WD)
; ==========================================
build_flags = 
     -DCORE_DEBUG_LEVEL=3

; ==========================================
; 启用自定义无线上传协议
; ==========================================
; upload_protocol = custom
; $SOURCE 是 PlatformIO 自动生成的 firmware.bin 的绝对路径
; upload_command = curl -s --data-binary "@$SOURCE" http://10.0.0.1/update

; 【新增】在编译前 (pre:) 执行 Python 脚本生成最新时间戳
extra_scripts = pre:pre_build_version.py